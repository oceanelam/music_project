<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recent Rotation • Spatial Glass Music Player</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Editorial fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="editorial-body">

  <!-- Subtle Studio Light Refractions (Warm neutral ambient) -->
  <div class="studio-light studio-light-1"></div>
  <div class="studio-light studio-light-2"></div>

  <!-- Understated Editorial Watermark in Background -->
  <div class="editorial-watermark" id="editorial-watermark">
    <span class="watermark-title">RECENT ROTATION</span>
    <span class="watermark-sub" id="watermark-user"></span>
  </div>

  <!-- Discrete Floating Minimal Close / Dock Button (visible only when opened) -->
  <button id="btn-dock-close" class="editorial-close-btn hidden" onclick="window.closeSpatialArena()" title="Collapse back into MP3 player" aria-label="Close floating cards">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
    <span>CLOSE</span>
  </button>

  <!-- Quiet Fallback Notification (clean, non-intrusive) -->
  <aside id="fallback-banner" class="editorial-notice hidden">
    <span id="fallback-text"></span>
    <button onclick="document.getElementById('fallback-banner').classList.add('hidden')">✕</button>
  </aside>

  <!-- Main Viewport -->
  <main class="spatial-canvas" id="spatial-canvas">

    <!-- ================================================================= -->
    <!-- 1. CLOSED STATE: Sleek Translucent Frosted Glass MP3 Object        -->
    <!-- ================================================================= -->
    <section class="closed-state-container" id="closed-container">
      <div class="mp3-artifact" id="closed-mp3-object" role="button" tabindex="0" onclick="window.openSpatialArena()" title="Click to open floating cards">
        <!-- Glass reflections -->
        <div class="artifact-specular"></div>

        <!-- Upper display slot -->
        <div class="artifact-header">
          <span class="artifact-label">AUDIO • ARCHIVE</span>
          <span class="artifact-dot"></span>
        </div>

        <!-- Center square album artwork -->
        <div class="artifact-art-frame">
          <img id="closed-cover-img" src="" alt="Album artwork" class="artifact-art-img" />
        </div>

        <!-- Minimal typography -->
        <div class="artifact-meta">
          <h2 class="artifact-title" id="closed-track-title">Loading...</h2>
          <p class="artifact-artist" id="closed-track-artist">Connecting to proxy</p>
        </div>

        <!-- Single Tactile Circular White Trigger Button -->
        <div class="artifact-controls">
          <div class="tactile-trigger" id="tactile-trigger-btn">
            <svg id="trigger-play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
            <svg id="trigger-pause-icon" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </div>
          <span class="tactile-caption">CLICK TO OPEN</span>
        </div>
      </div>
    </section>

    <!-- ================================================================= -->
    <!-- 3. ERROR / FALLBACK STATE (Clean message, no blank screen, no mocks)-->
    <!-- ================================================================= -->
    <section class="error-state-container hidden" id="error-container">
      <div class="glass-message-card">
        <div class="message-icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h2 class="message-title" id="error-title">Unable to load tracks</h2>
        <p class="message-desc" id="error-desc">Last.fm is currently unreachable.</p>
        <button class="message-btn" id="btn-retry" onclick="window.loadRecentTracks()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>Retry Connection</span>
        </button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
