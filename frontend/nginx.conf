server {
    listen 80;
    server_name localhost;

    # Root directory for static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API calls
    # All /api/ requests from the browser are routed securely to the Node.js backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through cache headers from backend
        proxy_pass_header X-Cache;
        proxy_pass_header X-Cache-TTL;
    }
}
