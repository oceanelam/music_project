services:
  # Backend API: Handles Last.fm requests, securely stores API key, and maintains in-memory cache
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music-backend-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_USERNAME=${LASTFM_USERNAME}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-60}
    restart: unless-stopped

  # Frontend UI: Nginx web server hosting the glassmorphic Floating MP3 Player and proxying /api/ to backend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: music-frontend-ui
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
